name: Build KernelSU Next

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: "Android KMI Version"
        required: true
        type: choice
        options:
          - 'android15'
          - 'android14'
          - 'android13'
          - 'android12'
        default: 'android15'
      
      KERNEL_VERSION:
        description: "Kernel Version"
        required: true
        type: choice
        options:
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
        default: '6.6'
      
      FEIL:
        description: "Device Manifest (default.xml etc.)"
        required: false
        default: 'default'
      
      lz4kd:
        description: "Enable lz4kd (Off: 6.1=lz4+zstd, 6.6=lz4)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'Off'
      
      bbr:
        description: "Enable BBR TCP Congestion Control"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'
      
      bbg:
        description: "Enable Baseband Guard Protection"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'
      
      proxy:
        description: "Enable Proxy Optimization (disable for MediaTek!)"
        required: true
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'

jobs:
  build:
    name: Build ${{ github.event.inputs.FEIL }} | lz4kd=${{ github.event.inputs.lz4kd }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      # ====================== System Initialization ======================
      - name: "🚀 Maximize Build Space"
        if: ${{ github.event.inputs.KERNEL_VERSION == '5.10' || github.event.inputs.KERNEL_VERSION == '5.15' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "⚙️ Setup Cache Environment"
        run: |
          echo "🔧 Setting up isolated cache directory..."
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FEIL }}_Next" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FEIL }}_Next"
          echo "✅ Cache directory set: $HOME/.ccache_${{ github.event.inputs.FEIL }}_Next"

      - name: "🔐 Configure Git"
        run: |
          echo "🔧 Configuring Git user..."
          git config --global user.name "build"
          git config --global user.email "build@github.actions"
          echo "✅ Git configured"

      # ====================== Dependency Management ======================
      - name: "📦 Cache & Install Build Dependencies"
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix lld
          execute_install_scripts: true

      # ====================== Cache Management ======================
      - name: "💾 Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.event.inputs.FEIL }}-Next-SUSFS-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-${{ github.event.inputs.FEIL }}-Next-SUSFS
            ccache-${{ runner.os }}-${{ github.event.inputs.FEIL }}-Next-SUSFS
            ccache-${{ runner.os }}-Next-SUSFS

      - name: "⚙️ Initialize ccache"
        run: |
          echo "🔧 Initializing ccache..."
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "🆕 ccache initialized"
            else
              echo "ℹ️ ccache already exists, skipping init"
            fi
          else
            echo "⚠️ ccache not found, skipping init"
          fi
          ccache -s
          echo "✅ ccache initialization complete"

      # ====================== Source Preparation ======================
      - name: "📥 Install Repo Tool"
        run: |
          echo "⬇️ Downloading repo tool..."
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ Repo tool installed"

      - name: "⬇️ Clone Kernel Source"
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          
          # Build the branch name from inputs
          BRANCH="common-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}"
          echo "🌐 Initializing kernel repository with branch: $BRANCH"
          
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$BRANCH" \
            -m ${{ github.event.inputs.FEIL || 'default' }}.xml \
            --depth=1
          
          echo "🔄 Syncing codebase (using $(nproc --all) threads)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          
          # Find and verify LLVM toolchain - USE ABSOLUTE PATH!
          LLVM_PATH=$(realpath prebuilts/clang/host/linux-x86/clang-*/bin | head -n1)
          
          if [ -z "$LLVM_PATH" ]; then
            echo "❌ Google LLVM toolchain not found!"
            ls -la prebuilts/clang/host/linux-x86/ || true
            exit 1
          fi
          
          # Save absolute path for other steps
          echo "LLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
          export PATH="$LLVM_PATH:$PATH"
          
          # Verify tools
          echo "📋 Toolchain verification:"
          which clang && clang --version | head -1
          which ld.lld && ld.lld --version | head -1
          which llvm-nm && echo "llvm-nm OK"
          which llvm-objcopy && echo "llvm-objcopy OK"
          which llvm-readelf && echo "llvm-readelf OK"
          
          echo "✅ Kernel source cloned successfully"

      # ====================== Kernel Customization ======================
      - name: "⚡ Setup Baseband-guard"
        if: ${{ github.event.inputs.bbg == 'On' }}
        run: |
          set -e
          cd kernel_workspace/common
          echo "🛠️ Setting up BBG..."
          curl -sSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh
          echo "✅ Baseband-guard setup complete"

      - name: "⚡ Setup KernelSU Next"
        run: |
          cd kernel_workspace/
          echo "🛠️ Setting up KernelSU Next..."
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          
          cd KernelSU-Next
          KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile
          echo "✅ KernelSU Next configured (Version: $KSU_VERSION)"

      - name: "🔧 Setup SUSFS"
        run: |
          cd kernel_workspace
          echo "⬇️ Downloading patches..."
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          git clone https://github.com/Xiaomichael/kernel_patches.git
          
          # Try susfs4ksu but have fallback
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }} || {
            echo "⚠️ susfs4ksu branch not found, trying main..."
            git clone https://gitlab.com/simonpunk/susfs4ksu.git
          }
          
          cd ./common
          
          # ============================================================
          # Use SukiSU SUSFS patches - more complete for newer kernels
          # ============================================================
          echo "📋 Checking available SukiSU SUSFS patches..."
          ls -la ../SukiSU_patch/susfs_patches/ 2>/dev/null || true
          
          SUSFS_PATCH=""
          # Try to find the right patch
          if [ -f "../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch" ]; then
            SUSFS_PATCH="../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch"
          elif [ -f "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch" ]; then
            SUSFS_PATCH="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch"
          fi
          
          # ============================================================
          # Copy SUSFS source files from SukiSU first (more complete)
          # ============================================================
          echo "📝 Copying SUSFS files from SukiSU..."
          
          # Check SukiSU structure
          if [ -d "../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}" ]; then
            echo "Found SukiSU susfs patches for ${{ github.event.inputs.KERNEL_VERSION }}"
            ls -la "../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/"
            
            # Copy fs files
            if [ -d "../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/fs" ]; then
              cp -rv ../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/fs/* fs/ 2>/dev/null || true
            fi
            
            # Copy include files
            if [ -d "../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/include" ]; then
              cp -rv ../SukiSU_patch/susfs_patches/${{ github.event.inputs.KERNEL_VERSION }}/include/* include/ 2>/dev/null || true
            fi
          fi
          
          # Also copy from susfs4ksu as fallback
          echo "📝 Copying additional files from susfs4ksu..."
          cp -v ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -v ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          
          # ============================================================
          # Check KernelSU-Next for SUSFS definitions
          # The dev-susfs branch should have these built-in
          # ============================================================
          echo "📋 Checking KernelSU-Next for SUSFS headers..."
          if [ -d "../KernelSU-Next/kernel/include" ]; then
            ls -la ../KernelSU-Next/kernel/include/ 2>/dev/null || true
            cp -v ../KernelSU-Next/kernel/include/linux/susfs*.h include/linux/ 2>/dev/null || true
          fi
          
          # ============================================================
          # Apply SUSFS patch
          # ============================================================
          if [ -n "$SUSFS_PATCH" ] && [ -f "$SUSFS_PATCH" ]; then
            echo "🔧 Applying SUSFS patch: $SUSFS_PATCH"
            patch -p1 -F 3 < "$SUSFS_PATCH" || {
              echo "⚠️ Patch had issues, continuing anyway..."
            }
          else
            echo "⚠️ No SUSFS patch found, SUSFS features may not work!"
          fi
          
          # ============================================================
          # Copy compression patches
          # ============================================================
          cp ../kernel_patches/zram/001-lz4.patch ./ 2>/dev/null || true
          cp ../kernel_patches/zram/lz4armv8.S ./lib/ 2>/dev/null || true
          cp ../kernel_patches/zram/002-zstd.patch ./ 2>/dev/null || true
          
          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            echo "📦 Copying lz4k files..."
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/ 2>/dev/null || true
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib/ 2>/dev/null || true
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto/ 2>/dev/null || true
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./lib/ 2>/dev/null || true
          fi
          
          echo "🔧 Applying compression patches..."
          if [ "${{ github.event.inputs.lz4kd }}" = "Off" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
            echo "📦 Applying lz4+zstd patches..."
            patch -p1 -F 3 < 001-lz4.patch 2>/dev/null || true
            patch -p1 -F 3 < 002-zstd.patch 2>/dev/null || true
          fi
          
          if [ "${{ github.event.inputs.lz4kd }}" = "Off" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
            echo "📦 Applying lz4 patch..."
            patch -p1 -F 3 < 001-lz4.patch 2>/dev/null || true
          fi
          
          if [ "${{ github.event.inputs.lz4kd }}" == "On" ]; then
            echo "🚀 Applying lz4kd patches..."
            if [ -f "../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch" ]; then
              patch -p1 -F 3 < ../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch || true
            fi
            if [ -f "../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4k_oplus.patch" ]; then
              patch -p1 -F 3 < ../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4k_oplus.patch || true
            fi
          fi
          
          # ============================================================
          # Create missing susfs_def.h if needed
          # ============================================================
          if [ ! -f include/linux/susfs_def.h ]; then
            echo "⚠️ Creating minimal susfs_def.h..."
            cat > include/linux/susfs_def.h << 'EOF'
          #ifndef _LINUX_SUSFS_DEF_H
          #define _LINUX_SUSFS_DEF_H
          
          /* SUSFS definitions - auto-generated */
          #include <linux/types.h>
          
          #define SUSFS_MAX_SUS_MNTS 64
          #define SUSFS_MAX_SUS_PATHS 256
          #define SUSFS_MAX_SUS_PATH_LEN 256
          #define SUSFS_MAX_SUS_KSTATS 64
          #define SUSFS_MAX_SUS_MAPS 64
          #define SUSFS_MAX_TRY_UMOUNT_PATHS 16
          
          #define BIT_SUS_MAPS (1 << 0)
          
          #endif /* _LINUX_SUSFS_DEF_H */
          EOF
            echo "✅ Created susfs_def.h"
          fi
          
          # ============================================================
          # Fix missing includes in source files
          # ============================================================
          echo "🔧 Fixing source file includes..."
          
          # Fix fs/notify/fdinfo.c
          if grep -q '#include <linux/susfs_def.h>' fs/notify/fdinfo.c; then
            # Check if susfs.h includes susfs_def.h or vice versa
            if grep -q 'susfs_def.h' include/linux/susfs.h 2>/dev/null; then
              sed -i 's|#include <linux/susfs_def.h>|#include <linux/susfs.h>|g' fs/notify/fdinfo.c
            fi
          fi
          
          # Add susfs.h include to fs/proc/base.c if needed
          if ! grep -q '#include <linux/susfs.h>' fs/proc/base.c && ! grep -q '#include <linux/susfs_def.h>' fs/proc/base.c; then
            sed -i '/#include <linux\/fs_struct.h>/a #include <linux/susfs.h>' fs/proc/base.c 2>/dev/null || \
            sed -i '/#include <linux\/mm.h>/a #include <linux/susfs.h>' fs/proc/base.c 2>/dev/null || true
          fi
          
          # ============================================================
          # Final verification
          # ============================================================
          echo "🔍 Final verification..."
          echo "SUSFS headers:"
          ls -la include/linux/susfs* 2>/dev/null || echo "No susfs headers!"
          echo ""
          echo "Checking for BIT_SUS_MAPS:"
          grep -rn "BIT_SUS_MAPS" include/linux/ 2>/dev/null | head -3 || echo "Not found in headers"
          echo ""
          echo "Checking fs/susfs.c:"
          ls -la fs/susfs.c 2>/dev/null || echo "fs/susfs.c not found!"
          
          echo "✅ SUSFS setup complete"

      - name: "⚙️ Configure Kernel (KSU + SUSFS)"
        run: |
          set -e
          cd kernel_workspace/common
          
          # Use absolute LLVM_PATH from environment
          export PATH="${{ env.LLVM_PATH }}:$PATH"
          
          echo "📋 Verifying tools in PATH:"
          which clang
          which ld.lld
          which llvm-nm
          
          # Create output directory and generate base config
          mkdir -p out
          make ARCH=arm64 O=out gki_defconfig
          
          # Basic kernel settings
          ./scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO \
            --set-val KSU_KPROBES_HOOK n
          
          # Enable KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU
          
          # Enable SUSFS features
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_KSU_SUSFS_SUS_MAP
          
          # Additional kernel options
          ./scripts/config --file out/.config \
            --enable CONFIG_TMPFS_XATTR \
            --enable CONFIG_TMPFS_POSIX_ACL \
            --enable CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
          
          # ============================================================
          # FIX: Increase frame warning limit for BPF verifier
          # The BPF verifier uses ~2400 bytes which exceeds default 2048
          # ============================================================
          ./scripts/config --file out/.config \
            --set-val CONFIG_FRAME_WARN 4096
          
          # BBR support if enabled
          if [ "${{ github.event.inputs.bbr }}" == "On" ]; then
            ./scripts/config --file out/.config \
              --enable CONFIG_TCP_CONG_BBR \
              --enable CONFIG_NET_SCH_FQ \
              --set-str CONFIG_DEFAULT_TCP_CONG bbr
          fi
          
          make ARCH=arm64 O=out olddefconfig
          
          # Verify critical configs
          echo "📋 Verifying kernel config:"
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_FRAME_WARN=" out/.config || true
          
          echo "✅ Kernel configuration complete"

      - name: "🔨 Build Kernel"
        run: |
          set -e
          cd kernel_workspace/common
          
          # Use absolute LLVM_PATH from environment (set in Clone step)
          export PATH="/usr/lib/ccache:${{ env.LLVM_PATH }}:$PATH"
          
          echo "📋 Build environment:"
          echo "  LLVM_PATH: ${{ env.LLVM_PATH }}"
          echo "  clang: $(which clang)"
          echo "  ld.lld: $(which ld.lld)"
          echo "  llvm-nm: $(which llvm-nm)"
          echo "  llvm-objcopy: $(which llvm-objcopy)"
          echo "  llvm-readelf: $(which llvm-readelf)"
          
          make -j$(nproc --all) \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            O=out
          
          ccache -s
          echo "✅ Kernel build complete"

      - name: "📦 Package Kernel"
        run: |
          echo "📦 Preparing AnyKernel3 packaging..."
          git clone https://github.com/Xiaomichael/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          
          mkdir -p kernel_workspace/out/Final-Image-Find/
          
          image_path=$(find "./kernel_workspace/common/out/" -name "Image" | head -n 1)
          
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            echo "✅ Found Image at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/out/Final-Image-Find/Image
          else
            echo "❌ Image not found!"
            find ./kernel_workspace/common/out/ -name "Image*" || true
            exit 1
          fi
          
          echo "✅ Kernel packaged successfully"

      # ====================== Upload Phase ======================
      - name: "🧠 Set Artifact Name"
        id: set_name
        run: |
          BASE="${{ github.event.inputs.FEIL }}_KernelSU_Next"
          
          if [ "${{ github.event.inputs.lz4kd }}" = "On" ]; then
            SUFFIX="lz4kd"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
            SUFFIX="lz4_zstd"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
            SUFFIX="lz4"
          else
            SUFFIX=""
          fi
          
          if [ -n "$SUFFIX" ]; then
            ARTIFACT_NAME="${BASE}_${SUFFIX}_${{ env.KSUVER }}"
          else
            ARTIFACT_NAME="${BASE}_${{ env.KSUVER }}"
          fi
          
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "📦 Artifact name: $ARTIFACT_NAME"

      - name: "📤 Upload AnyKernel3"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_name.outputs.ARTIFACT_NAME }}
          path: ./AnyKernel3/*
